<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arkive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0D1A0D;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1A1A1A;
      border: 1px solid #2A3A2A;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 8px;
      color: #8ACA8A;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 11px;
      letter-spacing: 3px;
      color: #3A6A3A;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    p { font-size: 14px; color: #5A7A5A; line-height: 1.7; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ARKIVE</div>
    <div class="tagline">Animal Health Register</div>
    <div id="content"><p>Loading...</p></div>
  </div>

  <script>
    function showContent(html) {
      document.getElementById('content').innerHTML = html;
    }

    function getParams() {
      var params = {};
      var search = window.location.search.substring(1);
      var hash = window.location.hash.substring(1);
      var combined = hash || search;
      combined.split('&').forEach(function(part) {
        var pair = part.split('=');
        if (pair.length === 2)
          params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
      });
      return params;
    }

    var params = getParams();
    var type = params['type'];

    // Show everything so we can see what Supabase is sending
    showContent(
      '<p style="color:#8ACA8A;word-break:break-all;text-align:left;">' +
      '<strong>Type:</strong> ' + (type || 'NOT FOUND') + '<br><br>' +
      '<strong>Full hash:</strong> ' + (window.location.hash || 'EMPTY') + '<br><br>' +
      '<strong>Full search:</strong> ' + (window.location.search || 'EMPTY') + '<br><br>' +
      '<strong>Full URL:</strong> ' + window.location.href +
      '</p>'
    );
  </script>
</body>
</html>
